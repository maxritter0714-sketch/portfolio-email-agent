name: Portfolio Report

on:
  schedule:
    - cron: '0 6 * * 6'  # Every Saturday 6am UTC (8am CEST)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full report regardless of date'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio agent
        uses: actions/checkout@v7

      - name: Checkout data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PORTFOLIO_DATA_REPO || 'maxritter0714-sketch/portfolio-agent-data' }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data
          fetch-depth: 0  # full history, to date the last export commit

      - name: Copy data files into data/
        run: |
          # Finanzfluss export if present, else a hand-kept portfolio.csv (fails if neither)
          if [ -f _data/finanzfluss_export.csv ]; then
            holdings=finanzfluss_export.csv
          else
            holdings=portfolio.csv
          fi
          cp "_data/$holdings" data/
          for f in history.csv conviction.json isin_map.json targets.json cashflows.csv; do
            cp "_data/$f" data/ 2>/dev/null || true
          done
          echo "PORTFOLIO_AS_OF=$(git -C _data log -1 --format=%cs -- "$holdings")" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Convert Finanzfluss export to portfolio.csv
        if: ${{ hashFiles('data/finanzfluss_export.csv') != '' }}
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python import_portfolio.py --input data/finanzfluss_export.csv --allow-missing

      - name: Collect weekly data point
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py --data-only

      - name: Run full report (every other Saturday, or forced)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python agent.py --force
          else
            python agent.py
          fi

      - name: Push updated data back to data repo
        # Runs even if the report step failed, so the weekly data point isn't lost.
        if: ${{ !cancelled() }}
        run: |
          cp data/history.csv _data/ 2>/dev/null || true
          cp data/conviction.json _data/ 2>/dev/null || true
          cd _data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.csv conviction.json
          git diff --cached --quiet || git commit -m "chore: update portfolio data $(date -u +%Y-%m-%d)"
          git push
